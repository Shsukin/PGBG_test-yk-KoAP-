<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGBD Тесты (By Shashukin)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f27;--muted:#667085;--line:#e3e6eb;--accent:#2f6fed;--soft:#e8f0ff;--ok:#16a34a;--okb:#dcfce7;--bad:#dc2626;--badb:#fee2e2;--gold:#e0a800}
:root[data-theme=dark]{--bg:#12151b;--card:#1a1e26;--text:#e6e9ef;--muted:#8b94a5;--line:#2a303b;--accent:#6b9bff;--soft:#1f2a44;--okb:#12351f;--badb:#3b1616}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151b;--card:#1a1e26;--text:#e6e9ef;--muted:#8b94a5;--line:#2a303b;--accent:#6b9bff;--soft:#1f2a44;--okb:#12351f;--badb:#3b1616}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px 70px}
.brand{font-size:22px;font-weight:800;line-height:1.2}.brand small{font-size:14px;font-weight:500;color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{min-height:54px;resize:vertical}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;font:inherit;font-weight:600;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer}
.seg button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.btn{font:inherit;font-weight:700;border:none;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.ok{background:var(--ok)}.btn.no{background:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--accent);font-size:14px}
.warn{color:var(--bad);font-size:12px;margin-top:2px}
/* run */
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.sec-tag{font-weight:700;color:var(--text)}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:-2px 0 12px}.prog i{display:block;height:100%;background:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.bar.low i{background:var(--bad)}
.q{font-size:20px;font-weight:700;line-height:1.35;margin:4px 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;padding:13px 14px;margin-bottom:8px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt b{display:inline-block;width:24px;color:var(--muted)}
.opt.pick{border-color:var(--accent);background:var(--soft)}
.big{font-size:34px;font-weight:800}
.ans{background:var(--okb);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:17px}
.ans small{display:block;color:var(--muted);font-size:12px}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mk .btn{font-size:18px;padding:16px}
.cnt{font-weight:800;font-size:18px;color:var(--text)}
/* result */
.score{font-size:30px;font-weight:800}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.p{color:var(--ok);font-weight:800}.n{color:var(--bad);font-weight:800}
pre.form{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;margin:0}
.hide{display:none}
.qa{border-top:1px solid var(--line);padding:8px 0;font-size:15px}.qa:first-of-type{border-top:none}.qh{display:flex;justify-content:space-between;font-size:13px}
.side{font-size:13px;display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.side span{padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.side .cur{border-color:var(--accent)}.side .p{background:var(--okb)}.side .n{background:var(--badb)}
@media print{.noprint{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">PGBD Тесты <small>(By Shashukin)</small></div>
  <div class="sub">От Владимира Шашукина · 326-637 Рублёвка · тесты для курсантов ГИБДД</div>

  <!-- НАСТРОЙКА -->
  <div id="setup">
    <div class="card">
      <h2>Кто сдаёт</h2>
      <div class="grid">
        <div><label>Имя Фамилия инструктора</label><input type="text" id="fi"></div>
        <div><label>Айди инструктора</label><input type="text" id="ii"></div>
        <div><label>Имя Фамилия курсанта</label><input type="text" id="fc"></div>
        <div><label>Айди курсанта</label><input type="text" id="ic"></div>
      </div>
    </div>
    <div class="card">
      <h2>Тест по кодексу</h2>
      <div class="seg" id="segCode"><button data-v="koap" class="on">КоАП</button><button data-v="uk">УК</button></div>
      <h2 style="margin-top:14px">Как сдаём</h2>
      <div class="seg" id="segMode">
        <button data-v="oral" class="on">Устно<br><span class="muted">инструктор спрашивает, ставит П / Н</span></button>
        <button data-v="written">Письменно<br><span class="muted">25 секунд на вопрос, 4 варианта</span></button>
      </div>
      <h2 style="margin-top:14px">Какие статьи</h2>
      <div class="seg" id="segComp">
        <button data-v="fixed" class="on">Как в бланке<br><span class="muted">фиксированный список</span></button>
        <button data-v="random">Случайно<br><span class="muted">из списка ГИБДД</span></button>
      </div>
      <details style="margin-top:12px"><summary>Списки статей и проходной балл</summary>
        <div id="lists" style="margin-top:10px"></div>
        <div class="grid" style="margin-top:6px">
          <div><label>Проходной балл, %</label><input type="text" id="passMark" value="80"></div>
          <div><label>Секунд на вопрос</label><input type="text" id="secs" value="25"></div>
        </div>
        <button class="btn sec" id="resetLists" style="margin-top:8px">Вернуть списки по умолчанию</button>
      </details>
    </div>
    <div class="row"><button class="btn" id="start">Начать тест</button><span class="muted" id="dbinfo"></span></div>
  </div>

  <!-- ТЕСТ -->
  <div id="run" class="hide"></div>
  <!-- РЕЗУЛЬТАТ -->
  <div id="result" class="hide"></div>
</div>

<script>
const DB = {"rows":[{"c":"uk","n":"37.1","t":"Убийство","ch":"Преступления против жизни и здоровья","pen":[["term","7 лет"]],"pdd":"","x":"37.1. Убийство, то есть умышленное причинение смерти другому человеку, –\n\nнаказывается лишением свободы на срок семи лет (СПРП «★★★★»)."},{"c":"uk","n":"37.2","t":"Убийство при отягчающих (2+ лиц, должностного лица, из ненависти)","ch":"Преступления против жизни и здоровья","pen":[["term","8 лет"]],"pdd":"","x":"37.2. Убийство:\nа) двух или более лиц;\nб) лица или его близких в связи с осуществлением данным лицом служебной деятельности или выполнением общественного долга;\nв) по мотивам политической, идеологической, расовой, национальной или религиозной ненависти или вражды либо по мотивам ненависти или вражды в отношении какой-либо социальной группы, –\n\nнаказывается лишением свободы на срок восьми лет (СПРП «★★★★»)."},{"c":"uk","n":"38.1","t":"Тяжкий вред здоровью","ch":"Преступления против жизни и здоровья","pen":[["term","5 лет"]],"pdd":"","x":"38.1. Причинение тяжкого вреда здоровью, опасного для жизни человека, или повлекшего за собой потерю сознания потерпевшего лица, –\n\nнаказывается лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"38.2","t":"Тяжкий вред здоровью при отягчающих (2+ лиц, хулиганство, ненависть)","ch":"Преступления против жизни и здоровья","pen":[["term","7 лет"]],"pdd":"","x":"38.2. То же деяние, совершенное:\nа) в отношении двух или более лиц;\nб) из хулиганских побуждений;\nв) по мотивам политической, идеологической, расовой, национальной или религиозной ненависти или вражды либо по мотивам ненависти или вражды в отношении какой-либо социальной группы, –\n\nнаказывается лишением свободы на срок семи лет (СПРП «★★★★»)."},{"c":"uk","n":"39","t":"Угроза убийством или причинением тяжкого вреда здоровью","ch":"Преступления против жизни и здоровья","pen":[["term","4 года"]],"pdd":"","x":"Угроза убийством или причинением тяжкого вреда здоровью, если имелись основания опасаться осуществления этой угрозы, –\n\nнаказывается лишением свободы на срок четырех лет (СПРП «★★★»)."},{"c":"uk","n":"40","t":"Изнасилование","ch":"Преступления против жизни и здоровья","pen":[["term","6 лет"]],"pdd":"","x":"Изнасилование, то есть половое сношение с применением насилия или с угрозой его применения к потерпевшей или к другим лицам либо с использованием беспомощного состояния потерпевшей, –\n\nнаказывается лишением свободы на срок шести лет (СПРП «★★★»)."},{"c":"uk","n":"41.1","t":"Похищение человека","ch":"Преступления против свободы, чести и достоинства личности","pen":[["term","6 лет"]],"pdd":"","x":"41.1. Похищение человека -\n\nнаказывается лишением свободы на срок шести лет (СПРП «★★★»)."},{"c":"uk","n":"41.2","t":"Похищение при отягчающих (группа, насилие, оружие, 2+ лиц)","ch":"Преступления против свободы, чести и достоинства личности","pen":[["term","6 лет"]],"pdd":"","x":"41.2. То же деяние, совершенное:\nа) группой лиц по предварительному сговору;\nб) с применением насилия, опасного для жизни или здоровья, либо с угрозой применения такого насилия;\nв) с применением оружия или предметов, используемых в качестве оружия;\nг) в отношении двух или более лиц, –\n\nнаказывается лишением свободы на срок шести лет (СПРП «★★★★»)."},{"c":"uk","n":"42","t":"Незаконное лишение свободы","ch":"Преступления против свободы, чести и достоинства личности","pen":[["term","4 года"]],"pdd":"","x":"Незаконное лишение человека свободы, не связанное с его похищением, –\n\nнаказывается лишением свободы на срок четырех лет (СПРП «★★★»)."},{"c":"uk","n":"43","t":"Нарушение неприкосновенности жилища","ch":"Преступления против собственности","pen":[["fine","20 000 ₽"],["term","3 года"]],"pdd":"","x":"Незаконное проникновение в жилище, совершенное против воли проживающего в нем лица, –\n\nнаказывается штрафом в размере двадцати тысяч (20.000) рублей, либо лишением свободы на срок трех лет (СПРП «★★»)."},{"c":"uk","n":"44","t":"Кража","ch":"Преступления против собственности","pen":[["fine","30 000 ₽"],["term","3 года"]],"pdd":"","x":"Кража, то есть тайное хищение чужого имущества, –\n\nнаказывается штрафом в размере тридцати тысяч (30.000) рублей или лишением свободы на срок трех лет (СПРП «★★»)."},{"c":"uk","n":"45.1","t":"Присвоение или растрата","ch":"Преступления против собственности","pen":[["fine","50 000 ₽"],["term","3 года"]],"pdd":"","x":"45.1. Присвоение или растрата, то есть хищение чужого имущества, вверенного виновному, –\n\nнаказываются штрафом в размере пятидесяти тысяч (50.000) рублей или лишением свободы на срок трех лет (СПРП «★★»)."},{"c":"uk","n":"45.2","t":"Мошенничество","ch":"Преступления против собственности","pen":[["fine","50 000 ₽"],["term","3 года"]],"pdd":"","x":"45.2. Мошенничество, то есть хищение чужого имущества или приобретение права на чужое имущество путем обмана или злоупотребления доверием, –\n\nнаказываются штрафом в размере пятидесяти тысяч (50.000) рублей или лишением свободы на срок трех лет (СПРП «★★★»)."},{"c":"uk","n":"46.1","t":"Грабёж","ch":"Преступления против собственности","pen":[["term","4 года"]],"pdd":"","x":"46.1. Грабеж, то есть открытое хищение чужого имущества, –\n\nнаказывается лишением свободы на срок четырех лет (СПРП «★★»)."},{"c":"uk","n":"46.2","t":"Грабёж группой / с проникновением в жилище","ch":"Преступления против собственности","pen":[["term","5 лет"]],"pdd":"","x":"46.2. Грабеж, совершенный:\nа) группой лиц по предварительному сговору;\nб) с незаконным проникновением в жилище, помещение либо иное хранилище;\n\nнаказывается лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"47.1","t":"Разбой","ch":"Преступления против собственности","pen":[["term","5 лет"]],"pdd":"","x":"47.1. Разбой, то есть нападение в целях хищения чужого имущества, совершенное с применением насилия, опасного для жизни или здоровья, либо с угрозой применения такого насилия, –\n\nнаказывается лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"47.2","t":"Разбой группой / с оружием","ch":"Преступления против собственности","pen":[["term","6 лет"]],"pdd":"","x":"47.2. Разбой, совершенный группой лиц по предварительному сговору, а равно с применением оружия или предметов, используемых в качестве оружия, –\n\nнаказывается лишением свободы на срок шести лет (СПРП «★★★★»)."},{"c":"uk","n":"47.3","t":"Разбой 2+ лиц / с тяжким вредом здоровью","ch":"Преступления против собственности","pen":[["term","7 лет"]],"pdd":"","x":"47.3. Разбой, совершённый:\nа) в отношении двух или более лиц;\nб) с причинением тяжкого вреда здоровью потерпевшего, –\n\nнаказывается лишением свободы на срок семи лет (СПРП «★★★★»)."},{"c":"uk","n":"48","t":"Умышленное уничтожение или повреждение имущества","ch":"Преступления против собственности","pen":[["fine","35 000 ₽"],["term","2 года"]],"pdd":"","x":"Умышленное уничтожение или повреждение государственной собственности, то есть совершение действий, направленных на причинение вреда имуществу, находящемуся в собственности государства, –\n\nнаказываются штрафом в размере тридцати пяти тысяч (35.000) рублей или лишением свободы на срок двух лет (СПРП «★★»).\n\nПримечание: Под значительным ущербом в настоящей статье и в дальнейшем понимается стоимость имущества в размере от пятисот тысяч (500.000) рублей."},{"c":"uk","n":"48-1","t":"Порча государственной собственности","ch":"Преступления против собственности","pen":[["fine","50 000 ₽"],["term","3 года"]],"pdd":"","x":"Уничтожение или повреждение государственной собственности, –\n\nнаказывается штрафом в размере пятидесяти тысяч (50.000) рублей или лишением свободы на срок трех лет (СПРП «★★★»).\n\nПримечание:\n1. Под умышленным уничтожением или повреждением понимается деяние, совершённое с прямым или косвенным умыслом, когда лицо осознавало противоправность своих действий, предвидело наступление вредных последствий и желало либо сознательно допускало их наступление.\n2. Понятие государственной собственности определяется Федеральным законом «О государственной собственности, закрытых и охраняемых территориях» № 86-ФЗ.\n3. Деяния, повлекшие повреждение государственной собственности по неосторожности (в том числе в результате дорожно‑транспортного происшествия), не подпадают под действие настоящей статьи и подлежат квалификации в соответствии с иными нормами законодательства."},{"c":"uk","n":"49.1","t":"Угон автомобиля","ch":"Преступления против собственности","pen":[["fine","35 000 ₽"],["term","2 года"]],"pdd":"","x":"49.1. Неправомерное завладение автомобилем или иным транспортным средством без цели хищения (угон), –\n\nнаказываются штрафом в размере тридцати пяти тысяч (35.000) рублей или лишением свободы на срок двух лет (СПРП «★★»)."},{"c":"uk","n":"49.2","t":"Угон служебного автомобиля (с цветографикой)","ch":"Преступления против собственности","pen":[["fine","100 000 ₽"],["term","4 года"]],"pdd":"","x":"49.2. Неправомерное завладение служебным автомобилем или иным транспортным специальным средством с нанесенными на него цветографическими схемами без цели хищения (угон), –\n\nнаказываются штрафом в размере ста тысяч (100.000) рублей или лишением свободы на срок четырёх лет (СПРП «★★★★»)."},{"c":"uk","n":"50","t":"Незаконное предпринимательство","ch":"Преступления в сфере экономической деятельности","pen":[["fine","200 000 ₽"],["term","2 года"]],"pdd":"","x":"Осуществление предпринимательской деятельности без регистрации или без лицензии, –\n\nнаказываются штрафом в размере двухсот тысяч (200.000) рублей или лишением свободы на срок двух лет (СПРП «★★»)."},{"c":"uk","n":"51","t":"Незаконное образование (создание, реорганизация) юридического лица","ch":"Преступления в сфере экономической деятельности","pen":[["fine","250 000 ₽"],["term","5 лет"]],"pdd":"","x":"Образование (создание, реорганизация) юридического лица в нарушение требования законодательства о коммерческой деятельности, –\n\nнаказываются штрафом в размере двухсот пятидесяти тысяч (250.000) рублей или лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"52","t":"Уклонение от срок семи лет (СПРП «★★★★★★»)."},{"c":"uk","n":"56","t":"Заведомо ложное сообщение об акте терроризма","ch":"Преступления против общественной безопасности","pen":[["term","6 лет"]],"pdd":"","x":"Заведомо ложное сообщение о готовящихся взрыве, поджоге или иных действиях, создающих опасность гибели людей, причинения значительного имущественного ущерба либо наступления иных общественно опасных последствий, совершенное из хулиганских побуждений, –\n\nнаказывается лишением свободы на срок шести лет (СПРП «★★★★»)."},{"c":"uk","n":"57","t":"Организация незаконного вооруженного формирования или участие в нем","ch":"Преступления против общественной безопасности","pen":[["term","7 лет"]],"pdd":"","x":"Создание вооруженного формирования (объединения, отряда, дружины или иной группы), не предусмотренного федеральным законом, а равно руководство таким формированием или его финансирование -\n\nнаказывается лишением свободы на срок семи лет (СПРП «★★★★★»)."},{"c":"uk","n":"58","t":"Бандитизм","ch":"Преступления против общественной безопасности","pen":[["term","8 лет"]],"pdd":"","x":"Создание устойчивой вооруженной группы (банды) в целях нападения на граждан или организации, а равно руководство такой группой (бандой) -\n\nнаказывается лишением свободы на срок восьми лет (СПРП «★★★★★★»)."},{"c":"uk","n":"59","t":"Угон судна воздушного или водного транспорта","ch":"Преступления против общественной безопасности","pen":[["term","5 лет"]],"pdd":"","x":"Угон судна воздушного или водного транспорта, а равно захват такого судна в целях угона -\n\nнаказывается лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"60","t":"Массовые беспорядки","ch":"Преступления против общественной безопасности","pen":[["term","5 лет"]],"pdd":"","x":"Организация массовых беспорядков, сопровождавшихся насилием, погромами, поджогами, уничтожением имущества, применением оружия, взрывных устройств, взрывчатых, отравляющих либо иных веществ и предметов, представляющих опасность для окружающих, а также оказанием вооруженного сопротивления представителю власти, а равно подготовка лица для организации таких массовых беспорядков или участия в них -\n\nнаказывается лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"61","t":"Хулиганство","ch":"Преступления против общественной безопасности","pen":[["fine","20 000 ₽"],["term","3 года"]],"pdd":"","x":"Хулиганство, то есть грубое нарушение общественного порядка, выражающее явное неуважение к обществу, совершенное:\nа) с применением насилия к гражданам либо угрозой его применения;\nб) по мотивам политической, идеологической, расовой, национальной или религиозной ненависти или вражды либо по мотивам ненависти или вражды в отношении какой-либо социальной группы;\nв) на железнодорожном, морском, внутреннем водном или воздушном транспорте, а также на любом ином транспорте общего пользования, –\n\nнаказываются штрафом в размере двадцати тысяч (20.000) рублей или лишением свободы на срок трех лет (СПРП «★★»)."},{"c":"uk","n":"62.1","t":"Проникновение на закрытый объект","ch":"Преступления против общественной безопасности","pen":[["fine","40 000 ₽"],["term","4 года"]],"pdd":"","x":"62.1. Незаконное проникновение или нахождение на объекте, закрытом для общего доступа соответствии с законодательством Российской Федерации о закрытых и охраняемых территориях, –\n\nнаказываются штрафом в размере сорока тысяч (40.000) рублей или лишением свободы на срок четырех лет (СПРП «★★★»)."},{"c":"uk","n":"62.2","t":"Проникновение на закрытый объект + тяжкое преступление","ch":"Преступления против общественной безопасности","pen":[["term","5 лет"]],"pdd":"","x":"62.2. То же деяние, сопряженное с совершением одного или нескольких преступлений, предусмотренных статьями 53, 59, 75, 87, 89, 90.2, 94 настоящего Кодекса, –\n\nнаказывается лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"62.3","t":"Проникновение на военный объект (воинская часть)","ch":"Преступления против общественной безопасности","pen":[["fine","80 000 ₽"],["term","5 лет"]],"pdd":"","x":"62.3. Незаконное проникновение или нахождение на объекте, принадлежащем воинским формированиям (воинские части), закрытые для общего доступа соответствии с законодательством Российской Федерации о закрытых и охраняемых территориях, –\n\nнаказываются штрафом в размере восьмидесяти тысяч (80.000) рублей или лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"62.4","t":"Проникновение на закрытый объект госслужащим","ch":"Преступления против общественной безопасности","pen":[["fine","600 000 ₽"],["term","4 года"]],"pdd":"","x":"62.4. Незаконное проникновение или нахождение на объекте, закрытом для общего доступа соответствии с законодательством Российской Федерации о закрытых и охраняемых территориях, государственным служащим, –\n\nнаказываются штрафом в размере шестисот тысяч (600.000) рублей или лишением свободы на срок четырех лет (СПРП «★★★»)."},{"c":"uk","n":"63.1","t":"Нелегальное оружие (100+ единиц оружия, частей, материалов)","ch":"Преступления против общественной безопасности","pen":[["term","4 года"]],"pdd":"","x":"63.1. Незаконное приобретение, хранение, передача, сбыт, или ношение оружия, его основных частей, материалов для его создания в количестве от ста (100) единиц, –\n\nнаказывается лишением свободы на срок четырех лет (СПРП «★★★»)."},{"c":"uk","n":"63.2","t":"Нелегальные бронежилеты (запрещённые средства индивидуальной защиты, СИЗ)","ch":"Преступления против общественной безопасности","pen":[["term","4 года"]],"pdd":"","x":"63.2. Незаконное приобретение, использование, хранение, передача, сбыт, или ношение запрещённых средств индивидуальной защиты, –\n\nнаказывается лишением свободы на срок четырех лет (СПРП «★★★»).\n\nПримечание: Список запрещенного/разрешенного вооружения, средств индивидуальной защиты регламентируется Федеральным законом \"Об оружии\" № 34-ФЗ."},{"c":"uk","n":"63.3","t":"Ношение огнестрельного оружия в открытую / демонстративное использование","ch":"Преступления против общественной безопасности","pen":[["term","5 лет"]],"pdd":"","x":"63.3. Ношение огнестрельного оружия в открытой форме либо его демонстративное использование в общественных местах вне рамок, предусмотренных законодательством Российской Федерации, –\n\nнаказывается лишением свободы на срок пяти лет (СПРП «★★★»)."},{"c":"uk","n":"63.4","t":"Причинение вреда здоровью с использованием оружия","ch":"Преступления против общественной безопасности","pen":[["term","6 лет"]],"pdd":"","x":"63.4. Причинение вреда здоровью с использованием оружия, –\n\nнаказывается лишением свободы на срок шести лет (СПРП «★★★★»)."},{"c":"uk","n":"64","t":"Незаконные приобретение, хранение, перевозка, изготовление, переработка наркотических…","ch":"Преступления против здоровья населения и общественной нравственности","pen":[["term","5 лет"]],"pdd":"","x":"Незаконные приобретение, хранение, перевозка, изготовление, переработка без цели сбыта наркотических средств, психотропных веществ или их аналогов, а также незаконные приобретение, хранение, перевозка реагентов, прекурсоров для изготовления наркотических средств, психотропных веществ или их аналогов, –\n\nнаказывается лишением свободы на срок пяти лет (СПРП «★★★»).\n\nПримечание:\n1. Под наркотическими средствами, психотропными веществами или их аналогами, реагентами и прекурсорами для их изготовления в настоящей статье, а также в статье 64.1 настоящего Кодекса понимаются наркотические вещества, психотропные средства или их аналоги со следующими условными наименованиями: “Спрайс”, “Голубой лед”, “Брейнкраш”, “Армейское Обезболивающее”, “Лечебная сигарета”, “Реагенты”.\n2. Опиоидные анальгетики, “Армейское Обезболивающее” могут храниться и использоваться сотрудниками гос. (силовых) структур при исполнении ими своих должностных обязанностей, а в ином случае порядок распоряжения вышеуказанными веществами устанавливается уставом организации. Внутренний нормативный акт также может закреплять отдельные случаи, допускающие использование веществ при выполнении конкретных служебных задач в период исполнения служебных полномочий."},{"c":"uk","n":"64.1","t":"Незаконные производство, сбыт или пересылка наркотических средств, психотропных…","ch":"Преступления против здоровья населения и общественной нравственности","pen":[["term","6 лет"]],"pdd":"","x":"Незаконные производство, сбыт или пересылка наркотических средств, психотропных веществ или их аналогов, –\n\nнаказывается лишением свободы на срок шести лет (СПРП «★★★★»)."},{"c":"uk","n":"65","t":"Организация или вовлечение в занятие проституцией","ch":"Преступления против здоровья населения и общественной нравственности","pen":[["term","4 года"]],"pdd":"","x":"Организация или вовлечение в занятие проституцией или принуждение к продолжению занятия проституцией, –\n\nнаказывается лишением свободы на срок четырех лет (СПРП «★★»)."},{"c":"uk","n":"65-1","t":"Незаконные изготовление и оборот порнографических материалов или предметов","ch":"Преступления против здоровья населения и общественной нравственности","pen":[["term","4 года"]],"pdd":"","x":"Незаконные изготовление и (или) распространение, публичная демонстрация или рекламирование порнографических материалов или предметов, –\n\nнаказывается лишением свободы на срок четырех лет (СПРП «★★»)."},{"c":"uk","n":"66","t":"Жестокое обращение с животными","ch":"Преступления против здоровья населения и общественной нравственности","pen":[["term","4 года"]],"pdd":"","x":"Жестокое обращение с животным в целях причинения ему боли и (или) страданий, а равно из хулиганских побуждений или из корыстных побуждений, повлекшее его гибель или увечье, –\n\nнаказывается лишением свободы на срок четырех лет (СПРП «★★»)."},{"c":"uk","n":"67.1","t":"Неуплата штрафа до 30.000","ch":"Преступления против здоровья населения и общественной нравственности","pen":[["fine","30 000 ₽"],["term","3 года"]],"pdd":"","x":"67.1. Неуплата или отказ от уплаты штрафа лицом, если штраф или сумма штрафов не превышает и не составляет тридцати тысяч (30.000) рублей, –\n\nнаказ (function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const CODE = { koap: 'КоАП', uk: 'УК' };
  const LS = 'pgbd_tests_v1';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rows = {}; DB.rows.forEach(r => rows[r.c + ':' + r.n] = r);
  const byCode = c => DB.rows.filter(r => r.c === c);
  const list = s => (s || '').split(/[\s,;]+/).filter(Boolean);

  // ---------- хранилище ----------
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) {}
  const persist = () => { try { localStorage.setItem(LS, JSON.stringify(saved)); } catch (e) {} };
  const cfg = { code: 'koap', mode: 'oral', comp: 'fixed' };
  const lists = () => { saved.lists = saved.lists || {}; return saved.lists; };
  const getList = (c, k) => ((lists()[c] || {})[k] != null ? lists()[c][k] : DB.defaults[c][k]);

  // ---------- настройка ----------
  function seg(id, key) {
    $(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      cfg[key] = b.dataset.v;
      [...$(id).children].forEach(x => x.classList.toggle('on', x === b));
      if (key === 'code') renderLists();
    });
  }
  seg('segCode', 'code'); seg('segMode', 'mode'); seg('segComp', 'comp');

  const LBL = { main: 'Основное (10 статей)', bonus: 'Бонус (4 статьи)', diff: 'Различия (2 статьи)', pool: 'Список ГИБДД для случайного выбора' };
  function renderLists() {
    const c = cfg.code;
    $('lists').innerHTML = ['main', 'bonus', 'diff', 'pool'].map(k =>
      `<div style="margin-bottom:8px"><label>${LBL[k]}</label><textarea data-k="${k}">${esc(getList(c, k))}</textarea><div class="warn" data-w="${k}"></div></div>`).join('');
    checkLists();
  }
  function checkLists() {
    $('lists').querySelectorAll('textarea').forEach(t => {
      const bad = list(t.value).filter(n => !rows[cfg.code + ':' + n]);
      $('lists').querySelector(`[data-w="${t.dataset.k}"]`).textContent = bad.length ? 'Нет в базе: ' + bad.join(', ') : '';
    });
  }
  $('lists').addEventListener('input', e => {
    const t = e.target; if (t.tagName !== 'TEXTAREA') return;
    const l = lists(); (l[cfg.code] = l[cfg.code] || {})[t.dataset.k] = t.value; persist(); checkLists();
  });
  $('resetLists').onclick = () => { delete lists()[cfg.code]; persist(); renderLists(); };
  ['fi', 'ii', 'fc', 'ic', 'passMark', 'secs'].forEach(id => {
    if (saved[id] != null) $(id).value = saved[id];
    $(id).addEventListener('input', () => { saved[id] = $(id).value; persist(); });
  });
  $('dbinfo').textContent = 'База: ' + DB.rows.length + ' статей' + (DB.edited ? ' · редакция от ' + DB.edited : '');
  renderLists();

  // ---------- генерация ----------
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const penText = r => r.pen.map(p => p[1]).join(' или ');
  const get = (c, n) => rows[c + ':' + n];

  function buildTest() {
    const c = cfg.code, pick = k => list(getList(c, k)).map(n => get(c, n)).filter(Boolean);
    let main, bonus, diff;
    if (cfg.comp === 'fixed') { main = pick('main'); bonus = pick('bonus'); diff = pick('diff'); }
    else {
      const pool = shuffle(pick('pool').filter(r => r.pen.length));
      main = pool.slice(0, 10); bonus = pool.slice(10, 14);
      const rest = pool.slice(14), a = rest[0];
      const same = rest.filter(r => r !== a && r.ch === a.ch);
      diff = [a, (same[0] || rest[1])].filter(Boolean);
    }
    const items = [];
    main.forEach(r => items.push({ sec: 'main', r }));
    bonus.forEach(r => items.push({ sec: 'bonus', r }));
    if (diff.length === 2) items.push({ sec: 'diff', r: diff[0], r2: diff[1] });
    return items;
  }

  function distractors(r, kind, n) {
    const all = byCode(r.c).filter(x => x !== r);
    const near = all.filter(x => x.ch === r.ch), far = all.filter(x => x.ch !== r.ch);
    const seen = new Set(), out = [];
    for (const x of [...shuffle(near), ...shuffle(far)]) {
      const key = kind === 'pen' ? penText(x) : x.n;
      if (kind === 'pen' && (!x.pen.length || key === penText(r))) continue;
      if (seen.has(key)) continue; seen.add(key); out.push(x); if (out.length >= n) break;
    }
    return out;
  }

  // вопрос по одной статье: «статья → наказание» или «название → статья»
  function makeQ(it) {
    const r = it.r, code = CODE[r.c];
    if (it.sec === 'diff') {
      const a = it.r, b = it.r2, pa = penText(a), pb = penText(b);
      const target = Math.random() < .5 ? a : b, tp = penText(target);
      const bothSame = pa === pb;
      let text, opts, correct;
      if (!bothSame) {
        text = `Различия ${a.n} и ${b.n}. Какая статья предусматривает наказание: «${tp}»?`;
        opts = ['ст. ' + a.n, 'ст. ' + b.n, 'Обе статьи', 'Ни одна']; correct = target === a ? 0 : 1;
      } else {
        const t2 = Math.random() < .5 ? a : b;
        text = `Различия ${a.n} и ${b.n}. Какая статья — «${t2.t}»?`;
        opts = ['ст. ' + a.n, 'ст. ' + b.n, 'Обе статьи', 'Ни одна']; correct = t2 === a ? 0 : 1;
      }
      return { kind: 'diff', text, opts, correct, key: opts[correct], say: `Различия ${a.n} / ${b.n}`,
        info: `${a.n} — ${a.t}: ${pa || '—'}\n${b.n} — ${b.t}: ${pb || '—'}` };
    }
    const useNum = !r.pen.length || Math.random() < .4;
    if (useNum) {
      const ds = distractors(r, 'num', 3);
      const opts = shuffle([r, ...ds]).map(x => 'ст. ' + x.n);
      return { kind: 'num', text: `Какая статья ${code} — «${r.t}»?`, opts, correct: opts.indexOf('ст. ' + r.n), key: 'ст. ' + r.n,
        say: `Спросите: какая статья ${code} — «${r.t}»?`, info: r.pen.length ? 'Наказание: ' + penText(r) : '' };
    }
    const ds = distractors(r, 'pen', 3);
    const opts = shuffle([r, ...ds].map(penText));
    return { kind: 'pen', text: `Статья ${r.n} ${code} — «${r.t}». Какое наказание?`, opts, correct: opts.indexOf(penText(r)), key: penText(r),
      say: `Спросите: какое наказание по статье ${r.n} — «${r.t}»?`, info: r.pdd ? 'ПДД: ' + r.pdd : '' };
  }

  // ---------- ход теста ----------
  let S = null, T = null;
  const secName = { main: 'ОСНОВНОЕ', bonus: 'БОНУС', diff: 'БОНУС · РАЗЛИЧИЯ' };
  const secsLimit = () => Math.max(5, parseInt($('secs').value, 10) || 25);

  $('start').onclick = () => {
    const items = buildTest();
    if (items.length < 5) { alert('В списках слишком мало статей, проверь «Списки статей».'); return; }
    S = { cfg: { ...cfg }, items, qs: items.map(makeQ), i: 0, marks: [], picks: [], t0: Date.now() };
    $('setup').classList.add('hide'); $('result').classList.add('hide'); $('run').classList.remove('hide');
    show();
  };

  const side = () => '';

  function show() {
    clearInterval(T);
    if (S.i >= S.items.length) return finish();
    const it = S.items[S.i], q = S.qs[S.i], tot = S.items.length;
    const head = `<div class="top"><span><span class="sec-tag">${secName[it.sec]}</span> · ${CODE[S.cfg.code]}</span><span>${S.i + 1} / ${tot}</span></div><div class="prog"><i style="width:${S.i / tot * 100}%"></i></div>`;
    if (S.cfg.mode === 'oral') {
      $('run').innerHTML = `<div class="card">${head}
        <div class="big">${it.sec === 'diff' ? 'Различия ' + esc(it.r.n) + ' / ' + esc(it.r2.n) : 'Статья ' + esc(it.r.n)}</div>
        <div style="margin:6px 0 4px;font-size:18px">${esc(q.say)}</div>
        <div class="ans"><small>Верный ответ</small>${esc(q.key).replace(/\n/g, '<br>')}${q.info ? `<small style="margin-top:6px;white-space:pre-line">${esc(q.info)}</small>` : ''}</div>
        <details><summary>Полный текст статьи</summary><div class="muted" style="white-space:pre-wrap;margin-top:6px">${esc(it.r.x)}${it.r2 ? '\n\n' + esc(it.r2.x) : ''}</div></details>
        <div class="mk"><button class="btn ok" data-m="1">Верно (П)</button><button class="btn no" data-m="0">Не верно (Н)</button></div>
        <div class="row" style="margin-top:10px"><button class="btn sec" id="back" ${S.i ? '' : 'disabled'}>← Назад</button><span class="muted">клавиши: 1 — верно, 2 — не верно</span></div>
        ${side()}</div>`;
      $('run').querySelectorAll('[data-m]').forEach(b => b.onclick = () => mark(+b.dataset.m));
      $('back').onclick = () => { S.i--; delete S.marks[S.i]; show(); };
    } else {
      const lim = secsLimit();
      $('run').innerHTML = `<div class="card">${head}
        <div class="row" style="justify-content:space-between"><span class="muted">Осталось</span><span class="cnt" id="cnt">${lim}</span></div>
        <div class="bar" id="bar"><i></i></div>
        <div class="q">${esc(q.text)}</div>
        ${q.opts.map((o, k) => `<button class="opt" data-k="${k}"><b>${k + 1}</b>${esc(o)}</button>`).join('')}
        ${side()}</div>`;
      $('run').querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
      const t0 = Date.now(), bar = $('bar');
      T = setInterval(() => {
        const left = Math.max(0, lim - (Date.now() - t0) / 1000);
        bar.firstChild.style.width = (left / lim * 100) + '%'; bar.classList.toggle('low', left < 6);
        $('cnt').textContent = Math.ceil(left);
        if (left <= 0) answer(-1);
      }, 100);
    }
  }
  function mark(m) { S.marks[S.i] = m; S.i++; show(); }
  function answer(k) {
    clearInterval(T); if (S.marks[S.i] !== undefined) return;
    S.picks[S.i] = k; S.marks[S.i] = k === S.qs[S.i].correct ? 1 : 0;
    const btn = $('run').querySelector(`.opt[data-k="${k}"]`); if (btn) btn.classList.add('pick');
    setTimeout(() => { S.i++; show(); }, 250);
  }
  document.addEventListener('keydown', e => {
    if (!S || $('run').classList.contains('hide') || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (S.cfg.mode === 'oral') { if (e.key === '1') mark(1); if (e.key === '2') mark(0); }
    else if (/^[1-4]$/.test(e.key)) answer(+e.key - 1);
  });

  // ---------- результат ----------
  function finish() {
    clearInterval(T);
    $('run').classList.add('hide'); $('result').classList.remove('hide');
    const sum = f => S.items.reduce((s, it, k) => s + (f(it) ? (S.marks[k] || 0) : 0), 0);
    const main = sum(it => it.sec === 'main'), bonus = sum(it => it.sec !== 'main');
    const nMain = S.items.filter(i => i.sec === 'main').length || 10;
    const pass = Math.max(1, parseInt($('passMark').value, 10) || 80);
    const nBon = Math.max(1, S.items.length - nMain), bonusPts = bonus * 5 / nBon;
    const pct0 = Math.round(main / nMain * 100), pct = Math.min(100, Math.round(main / nMain * 100 + bonusPts));
    const ok = pct >= pass;
    const g = k => ($(k).value || '').trim() || '________';
    const review = S.items.map((it, k) => {
      const q = S.qs[k], m = S.marks[k] === 1;
      const given = S.cfg.mode === 'written' ? (S.picks[k] >= 0 && S.picks[k] != null ? q.opts[S.picks[k]] : 'нет ответа (время)') : '';
      return `<tr><td>${esc(it.sec === 'diff' ? it.r.n + '/' + it.r2.n : it.r.n)}</td><td class="${m ? 'p' : 'n'}">${m ? 'П' : 'Н'}</td>
        <td>${esc(q.kind === 'diff' ? q.text : it.r.t)}${m || !given ? '' : `<div class="n" style="font-weight:400">Ответ: ${esc(given)}</div>`}${m ? '' : `<div class="p" style="font-weight:400">Верно: ${esc(q.key)}</div>`}</td></tr>`;
    }).join('');

    const X = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const col = ok ? '#166534' : '#b91c1c', navy = '#1d3557';
    const date = new Date().toLocaleDateString('ru-RU');
    const nm = X(g('fc')), nameSize = nm.length > 26 ? 46 : 62;
    const cert = `<svg id="cert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="width:100%;height:auto;display:block;border-radius:6px">
      <defs><clipPath id="inner"><rect x="46" y="46" width="1108" height="708"/></clipPath></defs>
      <rect width="1200" height="800" fill="#f3f6fb"/>
      <rect x="46" y="46" width="1108" height="708" fill="#ffffff"/>
      <g clip-path="url(#inner)">
        <rect x="46" y="46" width="1108" height="14" fill="#1c57a5"/>
        <!-- триколор -->
        <rect x="46" y="734" width="1108" height="7" fill="#ffffff"/>
        <rect x="46" y="741" width="1108" height="7" fill="#1c57a5"/>
        <rect x="46" y="748" width="1108" height="6" fill="#d52b1e"/>
      </g>
      <rect x="24" y="24" width="1152" height="752" fill="none" stroke="#1d3557" stroke-width="12"/>
      <g font-family="Georgia,'Times New Roman',serif" text-anchor="middle" fill="#1d3557">
        <text x="600" y="132" font-size="30" letter-spacing="14" font-weight="700">ГИБДД</text>
        <rect x="510" y="150" width="60" height="4" fill="#ffffff" stroke="#cbd5e1" stroke-width=".8"/><rect x="570" y="150" width="60" height="4" fill="#1c57a5"/><rect x="630" y="150" width="60" height="4" fill="#d52b1e"/>
        <text x="600" y="190" font-size="16" letter-spacing="3" fill="#6b7280">PGBD (BY SHASHUKIN)</text>
        <text x="600" y="282" font-size="82" font-weight="700" letter-spacing="5" fill="${col}">${ok ? 'ТЕСТ СДАН' : 'ТЕСТ НЕ СДАН'}</text>
        <text x="600" y="330" font-size="28" fill="#6b7280">${CODE[S.cfg.code]}</text>
        <text x="600" y="420" font-size="${nameSize}" font-weight="700">${nm}</text>
        <line x1="260" y1="440" x2="940" y2="440" stroke="#9ca3af" stroke-width="2"/>
        <text x="600" y="474" font-size="22" fill="#6b7280">ID ${X(g('ic'))}</text>
        <text x="600" y="545" font-size="30" letter-spacing="6" fill="#6b7280">ИТОГОВАЯ ОЦЕНКА</text>
        <text x="600" y="632" font-size="96" font-weight="700" fill="${col}">${pct}<tspan font-size="52" fill="#6b7280">/100</tspan></text>
        <text x="100" y="698" font-size="21" text-anchor="start" fill="#374151">${X(date)}</text>
        <text x="1100" y="698" font-size="21" text-anchor="end" fill="#374151">Инструктор: ${X(g('fi'))} · ${X(g('ii'))}</text>
      </g>
    </svg>`;
    const qa = S.items.map((it, k) => {
      const q = S.qs[k], good = S.marks[k] === 1, written = S.cfg.mode === 'written';
      const sec = it.sec === 'main' ? 'Основное' : 'Бонус';
      const text = written ? q.text : q.say.replace(/^Спросите:\s*/, '').replace(/^./, c => c.toUpperCase());
      const given = written ? (S.picks[k] != null && S.picks[k] >= 0 ? q.opts[S.picks[k]] : 'нет ответа (время вышло)') : (good ? 'верно' : 'не верно');
      return `<div class="qa"><div class="qh"><span class="muted">${k + 1}. ${sec}</span><b class="${good ? 'p' : 'n'}">${good ? 'П' : 'Н'}</b></div>
        <div>${esc(text)}</div>
        ${written ? `<div class="${good ? 'p' : 'n'}" style="font-weight:500">Ответ: ${esc(given)}</div>` : ''}
        ${good && written ? '' : `<div class="p" style="font-weight:500">Верный ответ: ${esc(q.key)}</div>`}</div>`;
    }).join('');
    $('result').innerHTML = `<div class="card" style="padding:10px">${cert}
      <div class="row noprint" style="margin-top:10px"><button class="btn" id="png">Скачать картинкой (PNG)</button><button class="btn sec" onclick="window.print()">Печать / PDF</button></div></div>
    <div class="card noprint"><h2>Вопросы и ответы</h2><div class="muted" style="margin-bottom:6px">Основное: ${main} из ${nMain} · Бонус: +${Math.round(bonusPts * 10) / 10} б. из 5 (бонус только добавляет, баллы не отнимает)</div>${qa}</div>
    <div class="row noprint"><button class="btn" id="again">Новый тест</button><button class="btn sec" id="same">Тот же состав ещё раз</button></div>`;
    $('png').onclick = () => {
      const xml = new XMLSerializer().serializeToString($('cert')), img = new Image();
      img.onload = () => { const c = document.createElement('canvas'); c.width = 2400; c.height = 1700; c.getContext('2d').drawImage(img, 0, 0, 2400, 1700);
        c.toBlob(bl => { const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = 'attestat-' + (g('fc').replace(/\s+/g, '_')) + '.png'; a.click(); }); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    };
    $('again').onclick = () => { $('result').classList.add('hide'); $('setup').classList.remove('hide'); S = null; $('fc').value = ''; $('ic').value = ''; saved.fc = ''; saved.ic = ''; persist(); };
    $('same').onclick = () => { const items = S.items; S = { cfg: S.cfg, items, qs: items.map(makeQ), i: 0, marks: [], picks: [] }; $('result').classList.add('hide'); $('run').classList.remove('hide'); show(); };
  }
})();
</script>
</body>
</html>
